# Clock: external 16 MHz full-can oscillator on XTAL1 (External Clock source)
#   CKSEL3:0 = 0000  -> external clock
#   SUT1:0   = 10    -> slowly rising power, 6 CK + 14 CK + 65 ms
#   CKDIV8   = 1     -> no clock division (full 16 MHz)
#   CKOUT    = 1     -> clock output disabled
lfuse = 0xe0
hfuse = 0xff
efuse = 0xff
lock = 0xff
